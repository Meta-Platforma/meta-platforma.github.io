<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex"><meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet,noimageindex"><title>МЕТА · Инструменты</title>
<style>:root{--blue:#1265d6;--ink:#162033;--muted:#697386;--line:#dce3ee;--bg:#f4f7fb}*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--ink);background:var(--bg)}body{display:flex;flex-direction:column;overflow:hidden}.bar{height:64px;flex:0 0 64px;display:flex;align-items:center;gap:22px;padding:0 20px;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 1px 8px #22334d12;z-index:3}.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.04em;white-space:nowrap}.mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(145deg,#1173ee,#0e4fb6);display:grid;place-items:center;color:#fff;font-size:13px}.nav{display:flex;gap:6px;min-width:0}.nav button{border:0;background:transparent;color:#526077;border-radius:9px;padding:10px 14px;font-weight:650;font-size:14px;cursor:pointer;white-space:nowrap}.nav button:hover{background:#edf4ff;color:var(--blue)}.nav button.active{background:#e6f0ff;color:var(--blue)}.actions{margin-left:auto;display:flex;align-items:center;gap:8px}.transfer{display:none;border:0;background:var(--blue);color:#fff;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer}.transfer.show{display:block}.status{font-size:12px;color:var(--muted);white-space:nowrap}.stage{position:relative;flex:1;min-height:0}.tool{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;display:none}.tool.active{display:block}@media(max-width:760px){.bar{height:auto;min-height:64px;flex-wrap:wrap;padding:10px}.nav{order:3;width:100%;overflow:auto}.brand{flex:1}.status{display:none}}</style></head>
<body><header class="bar"><div class="brand"><span class="mark">М</span><span>МЕТА</span></div><nav class="nav" aria-label="Инструменты"><button data-tool="catalog">Каталог квартир</button><button data-tool="configurator" class="active">Конфигуратор этажа</button><button data-tool="massing">Мета Массинг</button></nav><div class="actions"><span class="status" id="status">Доступ только по ссылке · noindex</span><button class="transfer" id="transfer">Передать план в Мета Массинг →</button></div></header>
<main class="stage"><iframe class="tool" id="catalog" title="Каталог квартир" data-src="https://meta-platforma.github.io/catalog/"></iframe><iframe class="tool active" id="configurator" title="Конфигуратор этажа" src="configurator.html"></iframe><iframe class="tool" id="massing" title="Мета Массинг" data-src="massing.html"></iframe></main>
<script>const buttons=[...document.querySelectorAll('[data-tool]')],frames=[...document.querySelectorAll('.tool')],transfer=document.getElementById('transfer'),status=document.getElementById('status');function show(id){if(!document.getElementById(id))id='configurator';buttons.forEach(b=>b.classList.toggle('active',b.dataset.tool===id));frames.forEach(f=>f.classList.toggle('active',f.id===id));const f=document.getElementById(id);if(!f.src&&f.dataset.src)f.src=f.dataset.src;transfer.classList.toggle('show',id==='configurator');history.replaceState(null,'','#'+id)}buttons.forEach(b=>b.onclick=()=>show(b.dataset.tool));transfer.onclick=()=>{try{const api=document.getElementById('configurator').contentWindow;if(!api||typeof api.getMetaMassingPayload!=='function')throw new Error('Сначала создайте план этажа');const payload=api.getMetaMassingPayload();localStorage.setItem('meta-floor-transfer-v1',JSON.stringify(payload));status.textContent=`Передан план ${payload.bounds.width_m.toFixed(1)} × ${payload.bounds.depth_m.toFixed(1)} м`;show('massing');setTimeout(()=>document.getElementById('massing').contentWindow.postMessage({type:'META_FLOOR_IMPORT',payload},location.origin),500)}catch(e){alert(e.message||e)}};window.addEventListener('message',e=>{if(e.data&&e.data.type==='META_MASSING_IMPORTED')status.textContent='План этажа добавлен в Мета Массинг'});show(location.hash.slice(1)||'configurator');</script></body></html>
